<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Daily Organic</title>
</head>

<body>

    <main class="container">
        <header class="hero-card">
            <p class="eyebrow">Organic Chemistry · Nomenclature</p>
            <h1 class="title">The Daily Organic</h1>
            <p class="subtitle">Sharpen your naming skills, one compound at a time.</p>
        </header>

        <section class="levels" aria-label="Choose a difficulty">
            <button class="level-card level-easy" type="button" data-level="easy">
                <span class="level-label">Easy</span>
                <span class="stars" aria-label="Difficulty 1 of 3">
                    <span class="star">&#9733;</span>
                    <span class="star">&#9734;</span>
                    <span class="star">&#9734;</span>
                </span>
            </button>

            <button class="level-card level-medium" type="button" data-level="medium">
                <span class="level-label">Medium</span>
                <span class="stars" aria-label="Difficulty 2 of 3">
                    <span class="star">&#9733;</span>
                    <span class="star">&#9733;</span>
                    <span class="star">&#9734;</span>
                </span>
            </button>

            <button class="level-card level-hard" type="button" data-level="hard">
                <span class="level-label">Hard</span>
                <span class="stars" aria-label="Difficulty 3 of 3">
                    <span class="star">&#9733;</span>
                    <span class="star">&#9733;</span>
                    <span class="star">&#9733;</span>
                </span>
            </button>
        </section>

        <footer class="footnote">
            <p>Inspired by The Daily Integral · Built for curious chemists</p>
        </footer>
    </main>

</body>

</html>
