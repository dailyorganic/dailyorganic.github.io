<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Medium Difficulty - The Daily Organic</title>
</head>

<body data-difficulty="medium">
    <main class="container">
        <!-- Navigation back to home -->
        <a href="../index.html" class="back-link">&larr; Back to Home</a>

        <!-- The Title Box (Using your Medium colors) -->
        <header class="quiz-header level-medium">
            <h1>Medium Difficulty</h1>
            <span class="stars" aria-label="Difficulty 2 of 3">
                <span class="star">&#9733;</span>
                <span class="star">&#9733;</span>
                <span class="star">&#9734;</span>
            </span>
        </header>

        <!-- The Molecule Rendering Area -->
        <section class="molecule-display">
            <img src="../images/medium.png" alt="Medium" class="molecule-image">
        </section>

        <!-- The Answer Input Box -->
        <section class="answer-section">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your IUPAC name here..." aria-label="Molecule Name">
            <button id="submitAnswer">Submit</button>
            <p id="result"></p>
        </section>
        
    </main>

    <script src="../script.js"></script>
</body>

</html>
